name: CI-CD Pipeline

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  build_test_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ---- Frontend ----
      - name: Install frontend dependencies
        working-directory: SDLC/DevOps_Foundations/IAS_Blueprint/frontend
        run: npm install

      - name: Build frontend
        working-directory: SDLC/DevOps_Foundations/IAS_Blueprint/frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: SDLC/DevOps_Foundations/IAS_Blueprint/frontend
        run: npm test

      # ---- Backend ----
      - name: Install backend dependencies
        working-directory: SDLC/DevOps_Foundations/IAS_Blueprint/backend
        run: npm install

      - name: Run backend tests
        working-directory: SDLC/DevOps_Foundations/IAS_Blueprint/backend
        run: npm test

      # ---- Deployment Simulation ----
      - name: Simulate deployment
        run: |
          mkdir -p staging
          cp -r SDLC/DevOps_Foundations/IAS_Blueprint/frontend/build staging/
          echo "Deployment simulation successful and validated."

      - name: Validate deployment simulation
        run: |
          test -d staging/build
          test -f staging/build/index.html
          echo "Deployment validation passed."
