<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset = "UTF-8" />
    <meta name = "viewport" content = "width = device-width, initial-scale = 1.0" />
    <title>Register</title>

    <link href = "https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel = "stylesheet">
</head>

<body class = "d-flex justify-content-center">
    <div class = "card shadow p-4" style = "width: 500px;">
        <h3 class = "mb-4 text-center">Registration Form</h3>
        
        <form id = "registerForm" class = "needs-validation" novalidate>
            <label for = "name" class = "form-label">Name</label>
            <input type = "text" class = "form-control" id = "name" minlength = "3" pattern = "[A-Za-z ]{3,}" required>
            <div class = "invalid-feedback">
                Name must be at least 3 letters (A–Z only).
            </div>
            
            <br>

            <label for = "email" class = "form-label">Email ID</label>
            <input type = "email" class = "form-control" id = "email" required>
            <div class = "invalid-feedback">
                Enter a valid email address
            </div>
            
            <br>

            <label for = "password" class = "form-label">Password</label>
            <input type = "password" class = "form-control" id = "password" minlength = "6" required>
            <div class = "invalid-feedback">
                Password must be at least 6 characters long
            </div>
            
            <br>

            <label for = "confirm" class = "form-label">Confirm Password</label>
            <input type = "password" class = "form-control" id = "confirm" required>
            <div class = "invalid-feedback">
                Passwords do not match
            </div>

            <br>

            <label class = "form-label">Contact Info</label>

            <div class = "input-group">
            <span class = "input-group-text">+1</span>

            <input type = "tel" class = "form-control" id = "phone1" inputmode = "numeric" pattern = "[0-9]{3}" maxlength = "3" required>
            <span class = "input-group-text">-</span>

            <input type = "tel" class = "form-control" id = "phone2" inputmode = "numeric" pattern = "[0-9]{3}" maxlength = "3" required>
            <span class = "input-group-text">-</span>

            <input type = "tel" class = "form-control" id = "phone3" inputmode = "numeric" pattern = "[0-9]{4}" maxlength = "4" required>
            </div>

            <div class = "invalid-feedback" id = "phoneError">
                Contact not valid
            </div>

            <br>

            <button type = "submit" class = "btn btn-success w-100 mt-2">Submit</button>
        </form>
    </div>

    <script src = "Form.js"></script>
</body>
</html>
