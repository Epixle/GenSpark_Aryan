<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link href = "https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel = "stylesheet">
    <link rel = "stylesheet" href = "Calculator.css">
</head>

<body class = "d-flex justify-content-center align-items-center">
    <div class = "card shadow p-3" style = "width: 300px; background-color: #ccc;">
        <div id = "answer" class = "form-control text-end mb-3"></div>
        
        <div class = "container-fluid">
            <div class = "row g-2">
                <div class = "col-9"></div>
                <div class = "col-3">
                    <button class = "btn btn-success w-100" onclick = "clearEntry()">CE</button>
                </div>

                <div class = "col-3">
                    <button class = "btn btn-light w-100">1</button>
                </div>
                <div class = "col-3">
                    <button class = "btn btn-light w-100">2</button>
                </div>
                <div class = "col-3">
                    <button class = "btn btn-light w-100">3</button>
                </div>
                <div class = "col-3">
                    <button class = "btn btn-warning w-100" onclick = "setOp('+')">+</button>
                </div>

                <div class = "col-3">
                    <button class = "btn btn-light w-100">4</button>
                </div>
                <div class = "col-3">
                    <button class = "btn btn-light w-100">5</button>
                </div>
                <div class = "col-3">
                    <button class = "btn btn-light w-100">6</button>
                </div>
                <div class = "col-3">
                    <button class = "btn btn-warning w-100" onclick = "setOp('-')">-</button>
                </div>

                <div class = "col-3">
                    <button class = "btn btn-light w-100">7</button>
                </div>
                <div class = "col-3">
                    <button class = "btn btn-light w-100">8</button>
                </div>
                <div class = "col-3">
                    <button class = "btn btn-light w-100">9</button>
                </div>
                <div class = "col-3">
                    <button class = "btn btn-warning w-100" onclick = "setOp('*')">*</button>
                </div>

                <div class = "col-3">
                    <button class = "btn btn-light w-100">0</button>
                </div>
                <div class = "col-3">
                    <button class = "btn btn-light w-100">.</button>
                </div>
                <div class = "col-3">
                    <button class = "btn btn-secondary w-100">=</button>
                </div>
                <div class = "col-3">
                    <button class = "btn btn-warning w-100" onclick = "setOp('/')">/</button>
                </div>
            </div>
        </div>
    </div>

    <script src = "Calculator.js"></script>
</body>
</html>
