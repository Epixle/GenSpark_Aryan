<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset = "UTF-8" />
    <meta name = "viewport" content = "width = device-width, initial-scale = 1.0" />
    <title>The Living Scroll</title>
    <link rel = "stylesheet" href = "styles.css" />
</head>
<body>
    <h1>The Living Scroll</h1>

    <div id = "counter">Total Entries: 0</div>

    <div class = "row">
        <input id = "input" type = "text" placeholder = "Write a new entry..." />
        <button id = "add">Add Entry</button>
    </div>

    <div id = "message"></div>

    <div id = "empty">The scroll is empty.</div>
    <div id = "entries"></div>

    <script src = "script.js"></script>
</body>
</html>
