<!DOCTYPE html>
<html lang = "en">
<head>
  <meta charset = "UTF-8">
  <title>Button of Fate</title>
  <link rel = "stylesheet" href = "styles.css">
</head>
<body>
    <h1>Button of Fate</h1>

    <div id = "display">Choose your fate.</div>

    <div id = "meter">
        Fate Meter: <span id = "value">0</span>
    </div>

    <div id = "prophecy" class = "hidden">
        Prophecy: A turning point approaches.
    </div>

    <div id = "buttons">
        <button id = "blessing">Blessing</button>
        <button id = "curse">Curse</button>
        <button id = "reveal">Reveal</button>
        <button id = "reset">Reset</button>
    </div>

    <script src = "script.js"></script>

</body>
</html>
